name: Build release

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      version:
        description: "Release version (optional; by default read from VER in JSX)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: release
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          JSX_FILE="Remote API img2img helper.jsx"
          JSX_VERSION="$(sed -nE 's/^[[:space:]]*VER[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' "${JSX_FILE}" | head -n 1)"

          if [ -z "${JSX_VERSION}" ]; then
            echo "Cannot read VER from ${JSX_FILE}"
            exit 1
          fi

          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
          else
            VERSION="${INPUT_VERSION#v}"
            if [ -z "${VERSION}" ]; then
              VERSION="${JSX_VERSION}"
            fi
            TAG="v${VERSION}"
          fi

          if ! [[ "${VERSION}" =~ ^[0-9]+([.][0-9]+)*$ ]]; then
            echo "Invalid version: ${VERSION}"
            exit 1
          fi

          if [ "${VERSION}" != "${JSX_VERSION}" ]; then
            echo "Release version ${VERSION} does not match JSX VER ${JSX_VERSION}"
            exit 1
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

      - name: Prepare release package
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          PACKAGE_NAME="Remote-API-img2img-helper-${VERSION}"
          PACKAGE_DIR="dist/${PACKAGE_NAME}"

          rm -rf dist
          mkdir -p "${PACKAGE_DIR}"

          cp "Remote API img2img helper.jsx" "${PACKAGE_DIR}/"
          cp "README.md" "${PACKAGE_DIR}/"
          cp -R "lib" "${PACKAGE_DIR}/"
          cp -R "advanced" "${PACKAGE_DIR}/"

          find "${PACKAGE_DIR}" -type d -name "__pycache__" -prune -exec rm -rf {} +
          find "${PACKAGE_DIR}" -type f \( -name "*.pyc" -o -name "*.pyo" \) -delete

          cd dist
          zip -r "${PACKAGE_NAME}.zip" "${PACKAGE_NAME}"

      - name: Prepare release notes
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "## История изменений"
            echo
            git log -1 --format=%B
          } > release-notes.md

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          ARCHIVE="dist/Remote-API-img2img-helper-${VERSION}.zip"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists"
            exit 1
          fi

          if git rev-parse "${TAG}^{commit}" >/dev/null 2>&1; then
            gh release create "${TAG}" \
              "${ARCHIVE}" \
              --verify-tag \
              --title "Remote API img2img helper ${VERSION}" \
              --notes-file release-notes.md \
              --latest
          else
            gh release create "${TAG}" \
              "${ARCHIVE}" \
              --target "${GITHUB_SHA}" \
              --title "Remote API img2img helper ${VERSION}" \
              --notes-file release-notes.md \
              --latest
          fi