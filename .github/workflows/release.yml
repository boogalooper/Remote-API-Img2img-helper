name: Build release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare release package
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_NAME="API-img2img-helper-${VERSION}"
          PACKAGE_DIR="dist/${PACKAGE_NAME}"

          rm -rf dist
          mkdir -p "${PACKAGE_DIR}"

          # Files required to run the script.
          cp "API img2img helper.jsx" "${PACKAGE_DIR}/"
          cp "api-img2img.pyw" "${PACKAGE_DIR}/"
          cp "README.md" "${PACKAGE_DIR}/"
          cp -R "cards" "${PACKAGE_DIR}/"
          cp -R "advanced" "${PACKAGE_DIR}/"

          # Guard against accidentally publishing development files.
          find "${PACKAGE_DIR}" -type d -name "__pycache__" -prune -exec rm -rf {} +
          find "${PACKAGE_DIR}" -type f \( -name "*.pyc" -o -name "*.pyo" \) -delete

          cd dist
          zip -r "${PACKAGE_NAME}.zip" "${PACKAGE_NAME}"

      - name: Prepare release notes
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "## История изменений"
            echo
            git log -1 --format=%B
          } > release-notes.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME#v}"
          ARCHIVE="dist/API-img2img-helper-${VERSION}.zip"

          gh release create "${GITHUB_REF_NAME}" \
            "${ARCHIVE}" \
            --verify-tag \
            --title "API img2img helper ${VERSION}" \
            --notes-file release-notes.md \
            --latest
